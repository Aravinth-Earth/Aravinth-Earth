name: Trigger Private Cypress Tests

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-private-cypress:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger test-my-site-cypress workflow
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'Aravinth-Earth',
              repo: 'test-my-site-cypress',
              workflow_id: 'cypress.yml',
              ref: 'main'
            });
