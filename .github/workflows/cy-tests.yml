name: Cypress E2E Tests

on:
  pull_request:
    branches: [site, main, master]
  workflow_dispatch:

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Cypress
        run: npm install cypress

      - name: Start server and run Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: w/sp
          browser: chrome
          headed: false
          config-file: cypress.config.js
          start: npx http-server . -p 8081
          wait-on: 'http://localhost:8081'
          timeout: 300

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-run-${{ github.run_number }}
          path: w/sp/test/e2e/screenshots
          retention-days: 7

      - name: Upload Videos  
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos-run-${{ github.run_number }}
          path: w/sp/cypress/videos
          retention-days: 7
