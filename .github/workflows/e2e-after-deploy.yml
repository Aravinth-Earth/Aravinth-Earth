name: E2E after deploy

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  dispatch-e2e:
    name: Dispatch deployment E2E
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check dispatch token
        id: token
        env:
          TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::E2E_DISPATCH_TOKEN is not set; deployment tests will be skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge Cloudflare cache (optional)
        if: steps.token.outputs.skip != 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ZONE" ]; then
            echo "::warning::Cloudflare secrets are not set; skipping purge"
            exit 0
          fi

          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          echo "$response"
          echo "$response" | jq -e '.success == true' > /dev/null || \
            echo "::warning::Cloudflare purge did not report success"

      - name: Dispatch deployment E2E
        if: steps.token.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.E2E_DISPATCH_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const sha = run ? run.head_sha : context.sha;
            const sourceRun = run
              ? run.html_url
              : `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            await github.rest.repos.createDispatchEvent({
              owner: 'Aravinth-Earth',
              repo: 'test-my-site-cypress',
              event_type: 'site-deployed',
              client_payload: {
                sha,
                site_url: 'https://www.332321.xyz',
                source_run_url: sourceRun,
                event: context.eventName
              }
            });
