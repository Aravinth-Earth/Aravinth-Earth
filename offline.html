<!DOCTYPE html>
<html lang="ta-en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | அருவிந்த்</title>
    <meta name="theme-color" content="#0d1117">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .offline-container {
            max-width: 600px;
        }
        h1 { 
            font-size: 2em;
            margin-bottom: 0.5em;
        }
        .emoji {
            font-size: 4em;
            margin: 20px 0;
        }
        .message {
            line-height: 1.6;
            margin: 20px 0;
        }
        .tamil {
            font-family: 'Noto Sans Tamil', system-ui, sans-serif;
            margin-bottom: 20px;
        }
        .retry-btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }
        .retry-btn:hover {
            background: #2ea043;
        }
        .cached-content {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #30363d;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="emoji">📡</div>
        <div class="tamil">
            <h1>இணைய இணைப்பு இல்லை</h1>
            <p class="message">
                தற்போது இணைய இணைப்பு இல்லை. சில பக்கங்கள் ஏற்கனவே சேமிக்கப்பட்டுள்ளன, அவற்றை நீங்கள் பார்வையிடலாம்.
            </p>
        </div>
        <div class="english">
            <h1>You're Offline</h1>
            <p class="message">
                No internet connection available. Some pages are cached and available offline.
            </p>
        </div>
        <button class="retry-btn" onclick="window.location.reload()">Try Again | மீண்டும் முயற்சிக்கவும்</button>
        
        <div class="cached-content">
            <p>Available offline | ஆஃப்லைனில் கிடைக்கும்:</p>
            <script>
                // Display cached pages dynamically
                caches.open('aravinth-site-v1').then(cache => {
                    cache.keys().then(requests => {
                        const urls = requests
                            .map(req => req.url)
                            .filter(url => url.endsWith('.html'));
                        const list = document.createElement('ul');
                        urls.forEach(url => {
                            const li = document.createElement('li');
                            li.textContent = url.split('/').pop();
                            list.appendChild(li);
                        });
                        document.querySelector('.cached-content').appendChild(list);
                    });
                });
            </script>
        </div>
    </div>
</body>
</html>
