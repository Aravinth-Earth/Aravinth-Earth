<!DOCTYPE html>
<html>
<head>
    <title>Balloon Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="controls">
        <label>Bullets per shot (1-5): <input type="number" id="bulletCount" min="1" max="5" value="5"></label>
        <label>Bullet Speed (1-10): <input type="number" id="bulletSpeed" min="1" max="10" value="1"></label>
        <label>Balloon Speed: <input type="number" id="balloonSpeed" min="1" max="5" value="1"></label>
        <label>Balloon Size: <input type="number" id="balloonSize" min="1" max="5" value="5"></label>
        <label>Max Balloons: <input type="number" id="maxBalloons" min="5" max="50" value="20"></label>
        <button id="pauseButton">Pause</button>
        <span>Score: <span id="score">0</span></span>
        <span>Lives: <span id="lives">5</span></span>
    </div>
    <div id="gameContainer">
        <div id="gun"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
