<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Digital Clock</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="../../css/about-privacy.css">
        <script src="script.js" defer></script>        
    </head>
    <body class="pitch-dark">
        <div style="display: none;">
            <h3>Local Clock</h3>
            shows time in 24 hr format, based on device local time
        </div>
        <div class="container">
            <!-- Clock display element -->
            <div id="clock" class="clock"></div>
            
            <!-- Settings panel -->
            <div id="settings-panel" class="settings-panel">
                <!-- Toggle 24-hour/12-hour format button -->
                <button id="toggle-format">Switch to 12-Hour Format</button>
                <!-- Dropdown for color mode selection -->
                <select id="color-mode">
                    <option value="pitch-dark">Pitch Dark</option>
                    <option value="classic-white">Classic White</option>
                    <option value="dynamic-color">Dynamic Color</option>
                </select>
                <!-- Font size slider -->
                <label for="font-size">Font Size: <span id="font-size-value"></span></label>
                <input type="range" id="font-size" min="15" max="150">
            </div>
            
            <!-- Fullscreen toggle button -->
            <button id="toggle-fullscreen">Toggle Fullscreen</button>
            
            <!-- Settings button to show/hide the settings panel -->
            <button id="settings-button">Settings</button>
        </div>
        <!-- JavaScript file -->        
    </body>
    <script src="../../js/about-privacy.js" defer></script>

</html>
