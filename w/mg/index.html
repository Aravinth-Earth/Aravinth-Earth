<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Game</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="light-theme">
    
    <div class="container light-theme">
        <section id="welcome-screen" class="screen">
            <h1>Math Game</h1>
            <div class="game-content">
                <input type="text" id="player-name" placeholder="Enter your name">
                <div class="button-group">
                    <button id="generate-name"><i class="fas fa-magic"></i> Generate Name</button>
                    <button id="start-game"><i class="fas fa-play"></i> Start Game</button>
                    <button id="reset-game"><i class="fas fa-redo"></i> Reset Progress</button>
                </div>
                <select id="difficulty">
                    <option value="1">Easy (+ -)</option>
                    <option value="2">Medium (* /)</option>
                    <option value="3">Hard (+ - * /)</option>
                    <option value="4">Expert (All)</option>
                </select>
                <div class="theme-controls">
                    <button class="toggle-theme"><i class="fas fa-adjust"></i> Theme</button>
                    <button class="toggle-color-theme"><i class="fas fa-palette"></i> Color</button>
                </div>
            </div>
        </section>

        <section id="game-screen" class="screen hidden">
            <div class="top-bar">
                <div class="theme-controls">
                    <button id="back-to-menu"><i class="fas fa-arrow-left"></i></button>
                    <button class="toggle-theme"><i class="fas fa-adjust"></i></button>
                    <button class="toggle-color-theme"><i class="fas fa-palette"></i></button>
                </div>
                <div class="user-info">
                    <div id="user-name"></div>
                    <div>Score: <span id="score">0</span></div>
                    <div class="difficulty">Difficulty: <span id="current-difficulty"></span></div>
                </div>
            </div>
            <div class="game-content">
                <h2 id="question"></h2>
                <input type="number" id="answer" placeholder="Your answer">
                <div class="game-controls">
                    <button id="submit-answer"><i class="fas fa-check"></i> Submit</button>
                    <button id="next-question" class="hidden"><i class="fas fa-arrow-right"></i> Next Question</button>
                </div>
                <p id="message"></p>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
