<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="light-theme theme-blue">
    <div class="container light-theme">
        <div id="welcome-screen" class="screen">
            <h1>Math Game</h1>
            <div class="game-content">
                <input type="text" id="player-name" placeholder="Enter your name">
                <div class="button-group">
                    <button id="generate-name">Generate Name</button>
                    <button id="start-game">Start Game</button>
                    <button id="reset-game">Reset Progress</button>
                </div>
                <select id="difficulty">
                    <option value="1">Level 1 (+ -)</option>
                    <option value="2">Level 2 (× ÷)</option>
                    <option value="3">Level 3 (Mix + -)</option>
                    <option value="4">Level 4 (Mix × ÷)</option>
                    <option value="5">Level 5 (All Mix)</option>
                </select>
                <div class="theme-controls">
                    <button id="toggle-theme">🔃 Theme </button>
                    <button id="toggle-color-theme">🔃 Color </button>
                </div>
            </div>
        </div>

        <div id="game-screen" class="screen hidden">
            <div class="top-bar">
                <div class="theme-controls">
                    <button id="back-to-menu">Menu</button>
                    <button id="toggle-theme">🔃 Theme</button>
                    <button id="toggle-color-theme">🔃 Color</button>
                </div>
                <div class="user-info">
                    <div id="user-name"></div>
                    <div>Score: <span id="score">0</span></div>
                </div>
            </div>
            <div class="game-content">
                <h2 id="question"></h2>
                <input type="number" id="answer" placeholder="Your answer">
                <div class="game-controls">
                    <button id="submit-answer">Submit</button>
                    <button id="next-question" class="hidden">Next Question</button>
                </div>
                <p id="message"></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
