<script>
            /* site-theme:applies-before-paint */
            (function () {
                try {
                    var THEMES = [
                        'current', 'light', 'amber', 'teal', 'charcoal',
                        'greenish', 'colorful', 'sunset', 'nord', 'cyberpunk'
                    ];
                    var saved = localStorage.getItem('site-theme');
                    // Validate before applying. An unknown value would fall
                    // through to the default tokens -- an unpainted page --
                    // and, because the switcher only reads valid keys, it
                    // would never be repaired. The switcher writes the
                    // resolved value back, so an invalid one self-heals.
                    if (saved && THEMES.indexOf(saved) !== -1) {
                        document.documentElement.setAttribute('data-theme', saved);
                    } else if (
                        window.matchMedia &&
                        window.matchMedia('(prefers-color-scheme: light)').matches
                    ) {
                        document.documentElement.setAttribute('data-theme', 'light');
                    } else {
                        document.documentElement.setAttribute('data-theme', 'current');
                    }
                } catch (e) {
                    /* storage unavailable -- the default theme is fine */
                }
            })();
        </script>
</head>
<body data-bare>
    <h1 class="visually-hidden">Nested Frame</h1>
    <h3>I am a nested iframe</h3>
    <div class="frame-indicator">Level 1 — Nested Frame</div>
    <p>This iframe loads another iframe inside it. To reach the innermost elements, switch through both frames.</p>
    <iframe src="inputs.html" name="innerIframe" height="200" width="100%" style="border:1px solid #30363d;border-radius:4px;background:#0d1117;" title="Inner iframe"></iframe>
    <script src="qa-playground.js"></script>
    <script src="/js/pwa.js" defer></script>
    <script src="/js/theme-switcher.js" defer></script>
    <script src="/js/privacy-manifest.js" defer></script>
    <script src="/js/about-privacy.js" defer></script>
</body>
