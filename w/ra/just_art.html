<!DOCTYPE html>
<html>
<head>
    <title>Simple Dynamic Art</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        svg { width: 100vw; height: 100vh; }
        /* Remove the shape transition that was causing unwanted animation */
    </style>
</head>
<body>
    <svg id="canvas">
        <defs>
            <radialGradient id="glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="white" stop-opacity="0"/>
            </radialGradient>
        </defs>
    </svg>

    <script>
        // Centralized configuration with recommended ranges and effects
        const ART_CONFIG = {
            canvas: {
                shapeCount: 400,
                size: {
                    min: 1,
                    max: 6
                },
                shape: {
                    // Probability of circle vs polygon (0-1)
                    circleChance: 0.5,
                    polygon: {
                        // Min and max number of sides for polygons
                        sides: {
                            min: 3,
                            max: 6
                        }
                    }
                }
            },
            lifecycle: {
                timing: {
                    // How long shapes can stay outside viewport (ms)
                    maxOutsideTime: 2000,
                    // Duration of fade animation (ms)
                    fadeOutDuration: 1000
                },
                probability: {
                    // Per-frame chances
                    spawn: 0.4,
                    disappear: 0.005
                },
                // Maximum shapes as percentage of shapeCount
                maxShapesPercent: 50
            },
            motion: {
                speed: {
                    min: 0.2,
                    max: 0.8
                },
                randomness: 0.2,
                interaction: {
                    radius: 50,
                    strength: 0.05
                }
            },
            colors: {
                hue: {
                    min: 0,
                    max: 360,
                    // Variation for gradient
                    variation: 30
                },
                saturation: {
                    min: 50,
                    max: 100,
                    // Default for gradient
                    gradient: 70
                },
                lightness: {
                    min: 30,
                    max: 70,
                    // Default for gradient
                    gradient: 50
                },
                opacity: {
                    min: 0.3,
                    max: 0.8,
                    gradient: {
                        start: 0.8,
                        end: 0
                    }
                }
            }
        };

        class ColorGenerator {
            static random(min, max) {
                return Math.random() * (max - min) + min;
            }

            static generate() {
                const hue = this.random(ART_CONFIG.colors.hue.min, ART_CONFIG.colors.hue.max);
                const saturation = this.random(ART_CONFIG.colors.saturation.min, ART_CONFIG.colors.saturation.max);
                const lightness = this.random(ART_CONFIG.colors.lightness.min, ART_CONFIG.colors.lightness.max);
                const opacity = this.random(ART_CONFIG.colors.opacity.min, ART_CONFIG.colors.opacity.max);
                
                return `hsla(${hue}, ${saturation}%, ${lightness}%, ${opacity})`;
            }

            static createGradient() {
                const baseHue = this.random(ART_CONFIG.colors.hue.min, ART_CONFIG.colors.hue.max);
                const hueVar = ART_CONFIG.colors.hue.variation;
                const sat = ART_CONFIG.colors.saturation.gradient;
                const light = ART_CONFIG.colors.lightness.gradient;
                
                return {
                    start: `hsla(${baseHue}, ${sat}%, ${light}%, ${ART_CONFIG.colors.opacity.gradient.start})`,
                    end: `hsla(${(baseHue + hueVar) % 360}, ${sat}%, ${light}%, ${ART_CONFIG.colors.opacity.gradient.end})`
                };
            }
        }

        class Shape {
            constructor() {
                this.element = document.createElementNS('http://www.w3.org/2000/svg', 
                    Math.random() < ART_CONFIG.canvas.shape.circleChance ? 'circle' : 'polygon');
                this.init();
                this.outOfViewSince = null;
                this.fadeStart = null;
            }

            init() {
                const color = ColorGenerator.generate();
                
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.size = Math.random() * (ART_CONFIG.canvas.size.max - ART_CONFIG.canvas.size.min) + ART_CONFIG.canvas.size.min;
                
                // Initialize with random direction and speed
                const speed = Math.random() * (ART_CONFIG.motion.speed.max - ART_CONFIG.motion.speed.min) + ART_CONFIG.motion.speed.min;
                const angle = Math.random() * Math.PI * 2;
                this.dx = Math.cos(angle) * speed;
                this.dy = Math.sin(angle) * speed;

                this.setupShape(color);
            }

            updateMovement() {
                // Add random movement vector
                const randomAngle = Math.random() * Math.PI * 2;
                const randomMagnitude = ART_CONFIG.motion.randomness;
                
                this.dx += Math.cos(randomAngle) * randomMagnitude;
                this.dy += Math.sin(randomAngle) * randomMagnitude;
                
                // Add interaction forces from nearby shapes
                this.applyInteractionForces();
                
                // Limit speed to prevent excessive acceleration
                const currentSpeed = Math.sqrt(this.dx * this.dx + this.dy * this.dy);
                if (currentSpeed > ART_CONFIG.motion.speed.max) {
                    this.dx = (this.dx / currentSpeed) * ART_CONFIG.motion.speed.max;
                    this.dy = (this.dy / currentSpeed) * ART_CONFIG.motion.speed.max;
                }
            }

            applyInteractionForces() {
                const interaction = ART_CONFIG.motion.interaction;
                
                shapes.forEach(other => {
                    if (other === this) return;

                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < interaction.radius && distance > 0) {
                        // Calculate repulsion force
                        const force = (interaction.radius - distance) * interaction.strength;
                        const angle = Math.atan2(dy, dx);
                        
                        // Apply force in opposite direction
                        this.dx -= Math.cos(angle) * force;
                        this.dy -= Math.sin(angle) * force;
                    }
                });
            }

            setupShape(color) {
                if (this.element.tagName === 'circle') {
                    this.element.setAttribute('r', this.size);
                    this.element.setAttribute('cx', this.x);
                    this.element.setAttribute('cy', this.y);
                } else {
                    this.element.setAttribute('points', this.generatePolygonPoints());
                }
                
                // Create unique gradient for each shape
                const gradientId = `gradient-${Math.random().toString(36).substr(2, 9)}`;
                const gradient = ColorGenerator.createGradient();
                
                const radialGradient = document.createElementNS('http://www.w3.org/2000/svg', 'radialGradient');
                radialGradient.setAttribute('id', gradientId);
                
                const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                stop1.setAttribute('offset', '0%');
                stop1.setAttribute('stop-color', gradient.start);
                
                const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                stop2.setAttribute('offset', '100%');
                stop2.setAttribute('stop-color', gradient.end);
                
                radialGradient.appendChild(stop1);
                radialGradient.appendChild(stop2);
                
                document.querySelector('defs').appendChild(radialGradient);
                
                this.element.setAttribute('fill', `url(#${gradientId})`);
                this.element.setAttribute('class', 'shape');
            }

            generatePolygonPoints() {
                const config = ART_CONFIG.canvas.shape.polygon.sides;
                const sides = Math.floor(Math.random() * (config.max - config.min + 1)) + config.min;
                return Array.from({length: sides}, (_, i) => {
                    const angle = (i / sides) * Math.PI * 2;
                    const px = this.x + Math.cos(angle) * this.size;
                    const py = this.y + Math.sin(angle) * this.size;
                    return `${px},${py}`;
                }).join(' ');
            }

            isInViewport() {
                const margin = this.size;
                return this.x >= -margin &&
                       this.x <= window.innerWidth + margin &&
                       this.y >= -margin &&
                       this.y <= window.innerHeight + margin;
            }

            fadeOut() {
                if (!this.fadeStart) {
                    this.fadeStart = Date.now();
                }
                const elapsed = Date.now() - this.fadeStart;
                const duration = ART_CONFIG.lifecycle.timing.fadeOutDuration; // 1 second fade
                const progress = Math.min(elapsed / duration, 1);
                
                return progress >= 1;
            }

            update() {
                // Random disappearance check
                if (!this.fadeStart && Math.random() < ART_CONFIG.lifecycle.probability.disappear) {
                    this.fadeStart = Date.now();
                }

                // If fading, update opacity
                if (this.fadeStart) {
                    const elapsed = Date.now() - this.fadeStart;
                    const duration = ART_CONFIG.lifecycle.timing.fadeOutDuration;
                    const progress = Math.min(elapsed / duration, 1);
                    const opacity = 1 - progress;
                    
                    this.element.style.opacity = opacity;
                }

                // Regular movement updates
                this.updateMovement();
                this.x = (this.x + this.dx + window.innerWidth) % window.innerWidth;
                this.y = (this.y + this.dy + window.innerHeight) % window.innerHeight;
                
                // Track time outside viewport
                if (!this.isInViewport()) {
                    if (!this.outOfViewSince) {
                        this.outOfViewSince = Date.now();
                    }
                } else {
                    this.outOfViewSince = null;
                }

                // Update visual representation
                if (this.element.tagName === 'circle') {
                    this.element.setAttribute('cx', this.x);
                    this.element.setAttribute('cy', this.y);
                } else {
                    const points = this.generatePolygonPoints();
                    this.element.setAttribute('points', points);
                }
            }

            shouldRemove() {
                return (this.outOfViewSince && 
                       (Date.now() - this.outOfViewSince > ART_CONFIG.lifecycle.timing.maxOutsideTime)) ||
                       (this.fadeStart && this.fadeOut());
            }
        }

        const canvas = document.getElementById('canvas');
        const shapes = new Set();

        function getMaxShapes() {
            return Math.floor(ART_CONFIG.canvas.shapeCount * (ART_CONFIG.lifecycle.maxShapesPercent / 100));
        }

        function createShapes() {
            shapes.forEach(shape => canvas.removeChild(shape.element));
            shapes.clear();
            // Start with half max shapes
            const initialCount = Math.floor(getMaxShapes() / 2);
            for (let i = 0; i < initialCount; i++) {
                const shape = new Shape();
                shapes.add(shape);
                canvas.appendChild(shape.element);
            }
        }

        function animate() {
            // Remove shapes that have been outside too long or have faded out
            shapes.forEach(shape => {
                if (shape.shouldRemove()) {
                    canvas.removeChild(shape.element);
                    shapes.delete(shape);
                }
            });

            // Randomly spawn new shapes if below max
            if (shapes.size < getMaxShapes() && 
                Math.random() < ART_CONFIG.lifecycle.probability.spawn) {
                const shape = new Shape();
                shapes.add(shape);
                canvas.appendChild(shape.element);
            }

            // Update existing shapes
            shapes.forEach(shape => shape.update());
            requestAnimationFrame(animate);
        }

        // Initialize
        window.onresize = () => {
            canvas.setAttribute('width', window.innerWidth);
            canvas.setAttribute('height', window.innerHeight);
        };
        window.onresize();
        createShapes();
        animate();
    </script>
</body>
</html>
