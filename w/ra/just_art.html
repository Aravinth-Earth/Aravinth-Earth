<!DOCTYPE html>
<html lang="en">
<head>
    <title>The Ephemeral Dance of Life | Interactive Art</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="An interactive digital art piece representing the chaotic yet beautiful patterns of life on Earth. Watch as abstract beings move, interact, and evolve in a dance of existence.">
    <meta name="keywords" content="digital art, interactive art, life patterns, chaos theory, emergence, particle simulation, generative art">
    <meta name="author" content="Your Name">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="The Ephemeral Dance of Life">
    <meta property="og:description" content="Interactive art exploring the randomness and beauty of life's patterns">
    <meta property="og:type" content="website">
    <meta property="og:image" content="path-to-preview-image.jpg"> <!-- Add preview image if available -->
    
    <!-- Theme Color for Browsers -->
    <meta name="theme-color" content="#000000">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦋</text></svg>">
    
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000;
            /* Optional: Add subtle background texture */
            background-image: radial-gradient(circle at center, #000510 0%, #000000 100%);
        }
        svg { 
            width: 100vw; 
            height: 100vh;
        }
        
        /* Add loading state styling */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            opacity: 1;
            transition: opacity 0.5s;
        }
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        /* Update quote container styling */
        .quote-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-family: Arial, sans-serif;
            font-size: 16px;
            pointer-events: none;
            transition: opacity 2s ease;
            max-width: 80%;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 100;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        
        .quote {
            margin: 0;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }
        
        .fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>
    <!-- Loading Message -->
    <div id="loading" class="loading">
        <h1>The Ephemeral Dance of Life</h1>
        <p>Witness the chaotic beauty of existence...</p>
    </div>

    <!-- Main Canvas -->
    <svg id="canvas" aria-label="Interactive visualization of life patterns">
        <defs>
            <radialGradient id="glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="white" stop-opacity="0"/>
            </radialGradient>
        </defs>
    </svg>

    <!-- Quote Container (only this, remove old poetic description) -->
    <div id="quoteContainer" class="quote-container">
        <p id="quote" class="quote"></p>
    </div>

    <script>
        // Show loading message
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 1500);
        });

        // Move PHILOSOPHICAL_QUOTES before ART_CONFIG
        const PHILOSOPHICAL_QUOTES = {
            tamil: [
                "வாழ்க்கை என்பது நீரோட்டம் போன்றது - எப்போதும் நகர்ந்து கொண்டே இருக்கிறது",  // Life flows like water
                "ஒவ்வொரு துகளும் பிரபஞ்சத்தின் நடனமாடும் வெளிப்பாடு",  // Each particle dances in cosmic expression
                "நாம் அனைவரும் ஒரே ஆற்றில் பயணிக்கும் அலைகள்",  // We are all waves in the same river
                "மாற்றமே மாறாத சத்தியம்",  // Change is the only constant truth
                "எல்லா உயிர்களும் ஒன்றோடொன்று பின்னிப் பிணைந்தவை",  // All lives are interconnected
                "பெற்றோர்களை கொண்டாடுங்கள், அவர்கள் இருக்கும் பொழுதே",  // Celebrate parents while they're here
                "வேர்களை மறக்காதே - அடிப்படை எளிமையே வாழ்வின் அழகு",  // Don't forget your roots
                "இன்று செய்யாவிடில் நாளை இல்லை",  // If not today, then never
                "தன்னை அறிந்தவனே தன்னை வெல்பவன்",  // One who knows self conquers self
                "மாற்றத்திற்கு ஏற்ப மாறுபவனே வெற்றி பெறுவான்"  // One who adapts to change succeeds
            ],
            english: [
                "Life flows like water - ever-moving, ever-changing",  // Match for first Tamil quote
                "Each particle is a dancing expression of the cosmos",  // Match for second Tamil quote
                "We are all waves in the same cosmic river",  // Match for third Tamil quote
                "Change is the only unchanging truth",  // Match for fourth Tamil quote
                "All beings are intricately woven together",  // Match for fifth Tamil quote
                "Celebrate your parents while they are present",  // Match for sixth Tamil quote
                "Never forget your roots - simplicity is life's beauty",  // Match for seventh Tamil quote
                "If not today, tomorrow may never come",  // Match for eighth Tamil quote
                "One who understands self becomes self's master",  // Match for ninth Tamil quote
                "Those who adapt to change shall prevail",  // Match for tenth Tamil quote
                "We do not inherit the Earth from our ancestors; we borrow it from our children",
                "Those who commit to nothing are distracted by everything",
                "Live a life worthy of remembrance, like stars in the night sky",
                "Be who you dream to be, for tomorrow is not promised",
                "If not you, then who? If not now, then when?"
            ]
        };

        class QuoteManager {
            constructor() {
                this.container = document.getElementById('quoteContainer');
                this.quoteElement = document.getElementById('quote');
                this.currentLanguage = 'english';
                this.updateInterval = 8000;
                this.fadeTime = 2000;
                
                // Ensure initial opacity
                this.container.style.opacity = '1';
            }

            getRandomQuote() {
                const quotes = PHILOSOPHICAL_QUOTES[this.currentLanguage];
                return quotes[Math.floor(Math.random() * quotes.length)];
            }

            async changeQuote() {
                // Fade out
                this.quoteElement.classList.add('fade-out');
                
                await new Promise(resolve => setTimeout(resolve, this.fadeTime));
                
                // Switch language and update text
                this.currentLanguage = this.currentLanguage === 'english' ? 'tamil' : 'english';
                this.quoteElement.textContent = this.getRandomQuote();
                
                // Fade in
                this.quoteElement.classList.remove('fade-out');
            }

            start() {
                // Set initial quote
                this.quoteElement.textContent = this.getRandomQuote();
                
                // Start cycle after initial display
                setTimeout(() => {
                    this.changeQuote();
                    setInterval(() => this.changeQuote(), this.updateInterval);
                }, this.updateInterval);
            }
        }

        // Add description to ART_CONFIG
        const ART_CONFIG = {
            description: {
                title: "The Ephemeral Dance of Life",
                concept: "A generative art piece representing the randomness and interconnectedness of life on Earth. " +
                        "Each particle symbolizes a living being, its movement reflecting the unpredictable yet " +
                        "purposeful nature of existence."
            },
            canvas: {
                shapeCount: 400,
                size: {
                    min: 1,
                    max: 6
                },
                shape: {
                    // Probability of circle vs polygon (0-1)
                    circleChance: 0.5,
                    polygon: {
                        // Min and max number of sides for polygons
                        sides: {
                            min: 3,
                            max: 6
                        }
                    }
                }
            },
            lifecycle: {
                timing: {
                    // How long shapes can stay outside viewport (ms)
                    maxOutsideTime: 2000,
                    // Duration of fade animation (ms)
                    fadeOutDuration: 1000
                },
                probability: {
                    // Per-frame chances
                    spawn: 0.4,
                    disappear: 0.005
                },
                // Maximum shapes as percentage of shapeCount
                maxShapesPercent: 50
            },
            motion: {
                speed: {
                    min: 0.2,
                    max: 0.8
                },
                randomness: 0.2,
                interaction: {
                    radius: 50,
                    strength: 0.05
                }
            },
            colors: {
                hue: {
                    min: 0,
                    max: 360,
                    // Variation for gradient
                    variation: 30
                },
                saturation: {
                    min: 50,
                    max: 100,
                    // Default for gradient
                    gradient: 70
                },
                lightness: {
                    min: 30,
                    max: 70,
                    // Default for gradient
                    gradient: 50
                },
                opacity: {
                    min: 0.3,
                    max: 0.8,
                    gradient: {
                        start: 0.8,
                        end: 0
                    }
                }
            }
        };

        class MathUtils {
            static random(min, max) {
                return Math.random() * (max - min) + min;
            }

            static randomInt(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            static distance(x1, y1, x2, y2) {
                const dx = x2 - x1;
                const dy = y2 - y1;
                return Math.sqrt(dx * dx + dy * dy);
            }
        }

        class ColorGenerator {
            static generate() {
                const hue = MathUtils.random(ART_CONFIG.colors.hue.min, ART_CONFIG.colors.hue.max);
                const saturation = MathUtils.random(ART_CONFIG.colors.saturation.min, ART_CONFIG.colors.saturation.max);
                const lightness = MathUtils.random(ART_CONFIG.colors.lightness.min, ART_CONFIG.colors.lightness.max);
                const opacity = MathUtils.random(ART_CONFIG.colors.opacity.min, ART_CONFIG.colors.opacity.max);
                
                return `hsla(${hue}, ${saturation}%, ${lightness}%, ${opacity})`;
            }

            static createGradient() {
                const baseHue = MathUtils.random(ART_CONFIG.colors.hue.min, ART_CONFIG.colors.hue.max);
                const hueVar = ART_CONFIG.colors.hue.variation;
                const sat = ART_CONFIG.colors.saturation.gradient;
                const light = ART_CONFIG.colors.lightness.gradient;
                
                return {
                    start: `hsla(${baseHue}, ${sat}%, ${light}%, ${ART_CONFIG.colors.opacity.gradient.start})`,
                    end: `hsla(${(baseHue + hueVar) % 360}, ${sat}%, ${light}%, ${ART_CONFIG.colors.opacity.gradient.end})`
                };
            }
        }

        class ShapeManager {
            constructor(canvas) {
                this.canvas = canvas;
                this.shapes = new Set();
                this.lastUpdate = Date.now();
            }

            create(count) {
                for (let i = 0; i < count; i++) {
                    const shape = new Shape(this);
                    this.shapes.add(shape);
                    this.canvas.appendChild(shape.element);
                }
            }

            update() {
                const currentTime = Date.now();
                const deltaTime = currentTime - this.lastUpdate;
                this.lastUpdate = currentTime;

                this.shapes.forEach(shape => {
                    try {
                        if (shape.shouldRemove()) {
                            this.canvas.removeChild(shape.element);
                            this.shapes.delete(shape);
                        }
                    } catch (error) {
                        console.error('Error removing shape:', error);
                        this.shapes.delete(shape);
                    }
                });

                if (this.shapes.size < this.getMaxShapes() && 
                    Math.random() < ART_CONFIG.lifecycle.probability.spawn) {
                    try {
                        this.create(1);
                    } catch (error) {
                        console.error('Error creating new shape:', error);
                    }
                }

                this.shapes.forEach(shape => {
                    try {
                        shape.update(deltaTime);
                    } catch (error) {
                        console.error('Error updating shape:', error);
                    }
                });
            }

            getMaxShapes() {
                return Math.floor(ART_CONFIG.canvas.shapeCount * 
                       (ART_CONFIG.lifecycle.maxShapesPercent / 100));
            }

            clear() {
                this.shapes.forEach(shape => this.canvas.removeChild(shape.element));
                this.shapes.clear();
            }
        }

        class Shape {
            constructor(shapeManager) {
                try {
                    this.element = document.createElementNS('http://www.w3.org/2000/svg', 
                        Math.random() < ART_CONFIG.canvas.shape.circleChance ? 'circle' : 'polygon');
                    this.shapeManager = shapeManager;
                    this.gradientId = null;
                    this.init();
                    this.outOfViewSince = null;
                    this.fadeStart = null;
                } catch (error) {
                    console.error('Error creating shape:', error);
                    throw error;
                }
            }

            cleanup() {
                if (this.gradientId) {
                    const gradient = document.getElementById(this.gradientId);
                    if (gradient) {
                        gradient.parentNode.removeChild(gradient);
                    }
                }
            }

            init() {
                const color = ColorGenerator.generate();
                
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.size = Math.random() * (ART_CONFIG.canvas.size.max - ART_CONFIG.canvas.size.min) + ART_CONFIG.canvas.size.min;
                
                const speed = Math.random() * (ART_CONFIG.motion.speed.max - ART_CONFIG.motion.speed.min) + ART_CONFIG.motion.speed.min;
                const angle = Math.random() * Math.PI * 2;
                this.dx = Math.cos(angle) * speed;
                this.dy = Math.sin(angle) * speed;

                this.setupShape(color);
            }

            updateMovement() {
                const randomAngle = Math.random() * Math.PI * 2;
                const randomMagnitude = ART_CONFIG.motion.randomness;
                
                this.dx += Math.cos(randomAngle) * randomMagnitude;
                this.dy += Math.sin(randomAngle) * randomMagnitude;
                
                this.applyInteractionForces();
                
                const currentSpeed = Math.sqrt(this.dx * this.dx + this.dy * this.dy);
                if (currentSpeed > ART_CONFIG.motion.speed.max) {
                    this.dx = (this.dx / currentSpeed) * ART_CONFIG.motion.speed.max;
                    this.dy = (this.dy / currentSpeed) * ART_CONFIG.motion.speed.max;
                }
            }

            applyInteractionForces() {
                const interaction = ART_CONFIG.motion.interaction;
                const maxDistance = interaction.radius;
                const maxDistanceSquared = maxDistance * maxDistance;
                
                this.shapeManager.shapes.forEach(other => {
                    if (other === this) return;

                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const distanceSquared = dx * dx + dy * dy;

                    if (distanceSquared < maxDistanceSquared && distanceSquared > 0) {
                        const distance = Math.sqrt(distanceSquared);
                        const force = (maxDistance - distance) * interaction.strength;
                        const angle = Math.atan2(dy, dx);
                        
                        this.dx -= Math.cos(angle) * force;
                        this.dy -= Math.sin(angle) * force;
                    }
                });
            }

            setupShape(color) {
                const svgNS = 'http://www.w3.org/2000/svg';
                try {
                    if (this.element.tagName === 'circle') {
                        this.element.setAttribute('r', this.size);
                        this.element.setAttribute('cx', this.x);
                        this.element.setAttribute('cy', this.y);
                    } else {
                        this.element.setAttribute('points', this.generatePolygonPoints());
                    }
                    
                    this.gradientId = `gradient-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
                    const gradient = ColorGenerator.createGradient();
                    
                    const radialGradient = document.createElementNS(svgNS, 'radialGradient');
                    radialGradient.setAttribute('id', this.gradientId);
                    
                    const stop1 = document.createElementNS(svgNS, 'stop');
                    stop1.setAttribute('offset', '0%');
                    stop1.setAttribute('stop-color', gradient.start);
                    
                    const stop2 = document.createElementNS(svgNS, 'stop');
                    stop2.setAttribute('offset', '100%');
                    stop2.setAttribute('stop-color', gradient.end);
                    
                    radialGradient.appendChild(stop1);
                    radialGradient.appendChild(stop2);
                    
                    document.querySelector('defs').appendChild(radialGradient);
                    
                    this.element.setAttribute('fill', `url(#${this.gradientId})`);
                    this.element.setAttribute('class', 'shape');
                } catch (error) {
                    console.error('Error setting up shape:', error);
                    throw error;
                }
            }

            generatePolygonPoints() {
                const config = ART_CONFIG.canvas.shape.polygon.sides;
                const sides = Math.floor(Math.random() * (config.max - config.min + 1)) + config.min;
                return Array.from({length: sides}, (_, i) => {
                    const angle = (i / sides) * Math.PI * 2;
                    const px = this.x + Math.cos(angle) * this.size;
                    const py = this.y + Math.sin(angle) * this.size;
                    return `${px},${py}`;
                }).join(' ');
            }

            isInViewport() {
                const margin = this.size;
                return this.x >= -margin &&
                       this.x <= window.innerWidth + margin &&
                       this.y >= -margin &&
                       this.y <= window.innerHeight + margin;
            }

            fadeOut() {
                if (!this.fadeStart) {
                    this.fadeStart = Date.now();
                }
                const elapsed = Date.now() - this.fadeStart;
                const duration = ART_CONFIG.lifecycle.timing.fadeOutDuration;
                const progress = Math.min(elapsed / duration, 1);
                
                return progress >= 1;
            }

            update() {
                if (!this.fadeStart && Math.random() < ART_CONFIG.lifecycle.probability.disappear) {
                    this.fadeStart = Date.now();
                }

                if (this.fadeStart) {
                    const elapsed = Date.now() - this.fadeStart;
                    const duration = ART_CONFIG.lifecycle.timing.fadeOutDuration;
                    const progress = Math.min(elapsed / duration, 1);
                    const opacity = 1 - progress;
                    
                    this.element.style.opacity = opacity;
                }

                this.updateMovement();
                this.x = (this.x + this.dx + window.innerWidth) % window.innerWidth;
                this.y = (this.y + this.dy + window.innerHeight) % window.innerHeight;
                
                if (!this.isInViewport()) {
                    if (!this.outOfViewSince) {
                        this.outOfViewSince = Date.now();
                    }
                } else {
                    this.outOfViewSince = null;
                }

                if (this.element.tagName === 'circle') {
                    this.element.setAttribute('cx', this.x);
                    this.element.setAttribute('cy', this.y);
                } else {
                    const points = this.generatePolygonPoints();
                    this.element.setAttribute('points', points);
                }
            }

            shouldRemove() {
                const shouldRemove = (this.outOfViewSince && 
                    (Date.now() - this.outOfViewSince > ART_CONFIG.lifecycle.timing.maxOutsideTime)) ||
                    (this.fadeStart && this.fadeOut());
                
                if (shouldRemove) {
                    this.cleanup();
                }
                
                return shouldRemove;
            }
        }

        class ArtGenerator {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.shapeManager = new ShapeManager(this.canvas);
                this.setupResizeHandler();
                this.setupCleanup();
                this.quoteManager = new QuoteManager();
            }

            setupResizeHandler() {
                window.addEventListener('resize', () => {
                    this.canvas.setAttribute('width', window.innerWidth);
                    this.canvas.setAttribute('height', window.innerHeight);
                });
                this.canvas.setAttribute('width', window.innerWidth);
                this.canvas.setAttribute('height', window.innerHeight);
            }

            start() {
                this.shapeManager.create(Math.floor(this.shapeManager.getMaxShapes() / 2));
                this.animate();
                this.quoteManager.start();
            }

            animate = () => {
                this.shapeManager.update();
                requestAnimationFrame(this.animate);
            }

            cleanup() {
                this.shapeManager.clear();
                const defs = document.querySelector('defs');
                while (defs.firstChild) {
                    defs.removeChild(defs.firstChild);
                }
            }

            setupCleanup() {
                window.addEventListener('unload', () => this.cleanup());
            }
        }

        const artGenerator = new ArtGenerator();
        artGenerator.start();
    </script>
</body>
</html>
