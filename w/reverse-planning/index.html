<script>
            /* site-theme:applies-before-paint */
            (function () {
                try {
                    var THEMES = [
                        'current', 'light', 'amber', 'teal', 'charcoal',
                        'greenish', 'colorful', 'sunset', 'nord', 'cyberpunk'
                    ];
                    var saved = localStorage.getItem('site-theme');
                    // Validate before applying. An unknown value would fall
                    // through to the default tokens -- an unpainted page --
                    // and, because the switcher only reads valid keys, it
                    // would never be repaired. The switcher writes the
                    // resolved value back, so an invalid one self-heals.
                    if (saved && THEMES.indexOf(saved) !== -1) {
                        document.documentElement.setAttribute('data-theme', saved);
                    } else if (
                        window.matchMedia &&
                        window.matchMedia('(prefers-color-scheme: light)').matches
                    ) {
                        document.documentElement.setAttribute('data-theme', 'light');
                    } else {
                        document.documentElement.setAttribute('data-theme', 'current');
                    }
                } catch (e) {
                    /* storage unavailable -- the default theme is fine */
                }
            })();
        </script>

<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
<header>
<h1>Timeline Planner</h1>
<div class="header-controls">
<select id="time-interval" aria-label="Select Time Interval">
<option value="5">5m</option>
<option value="10">10m</option>
<option value="15">15m</option>
<option value="30" selected>30m</option>
<option value="60">1h</option>
<option value="120">2h</option>
<option value="180">3h</option>
<option value="360">6h</option>
</select>
<button id="import-json" aria-label="Import JSON" onclick="document.getElementById('load-plan').click()">📥</button>
<button id="export-json" aria-label="Export JSON" onclick="window.exportPlan()">📤</button>
<button id="clear-data" aria-label="Clear Data" onclick="clearData()">🗑️</button>

</div>

<main id="main-content" tabindex="-1">
<section id="input-section" aria-label="Timeline Input">
<h2>Plan Your Timeline</h2>
<form id="timeline-form" onsubmit="return false;">
<label for="event-name">Event Name (optional):</label>
<input type="text" id="event-name" name="eventName">
<label for="target-end-time">Target End Time:</label>
<input type="datetime-local" id="target-end-time" name="targetEndTime" required>
<div id="events-container">
<h3>Events</h3>
<div class="event">
<input type="text" name="eventName" placeholder="Name" required aria-label="Event name">
<input type="number" name="eventDuration" placeholder="Mins" min="1" required aria-label="Event duration in minutes">
<button type="button" class="move-up" aria-label="Move Up">⬆️</button>
<button type="button" class="move-down" aria-label="Move Down">⬇️</button>
<button type="button" class="remove-event" aria-label="Remove">🗑️</button>
</div>
</div>
<button type="button" id="add-event" aria-label="Add Event">➕</button>
</form>
</section>
<section id="timeline-section" aria-label="Timeline Display">
<h2>Calculated Timeline</h2>
<div id="timeline">
<div class="timeline-content">
<div class="timeline-events-column" id="timeline-events-column"></div>
</div>
</div>
</section>
</main>
<input type="file" id="load-plan" accept=".json" hidden aria-label="Load Plan">
<script src="script.js" type="module"></script>
<!--
    The event rows are built by script.js, so the inputs inside them cannot
    be given a name in the markup. A placeholder is not an accessible name,
    so every event input is named here instead -- both the one in the
    template and the ones the script creates.
-->
<script>
(function () {
    function labelEventInputs(root) {
        var names = root.querySelectorAll('input[name="eventName"]');
        for (var i = 0; i < names.length; i++) {
            if (!names[i].getAttribute('aria-label')) {
                names[i].setAttribute('aria-label', 'Event name');
            }
        }
        var durations = root.querySelectorAll('input[name="eventDuration"]');
        for (var j = 0; j < durations.length; j++) {
            if (!durations[j].getAttribute('aria-label')) {
                durations[j].setAttribute('aria-label', 'Event duration in minutes');
            }
        }
    }

    function start() {
        var container = document.getElementById('events-container');
        if (!container) {
            return;
        }
        labelEventInputs(document);
        if (typeof MutationObserver === 'function') {
            new MutationObserver(function () {
                labelEventInputs(container);
            }).observe(container, { childList: true, subtree: true });
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
    } else {
        start();
    }
})();
</script>
