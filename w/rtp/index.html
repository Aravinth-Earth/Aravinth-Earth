<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

    <meta property="og:title" content="Timeline Planner — Aravinth" />
    <meta property="og:description" content="Reverse timeline planning tool" />
    <meta property="og:image" content="/favicon.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Timeline Planner — Aravinth" />
    <meta name="twitter:description" content="Reverse timeline planning tool" />
    <meta name="twitter:image" content="/favicon.png" />
    <meta name="description" content="Reverse timeline planning tool">
<title>Timeline Planner — Reverse Planning Tool</title>
<link rel="stylesheet" href="styles.css">
<link rel="prefetch" href="/index.html">
</head>
<body>
<header>
<h1>Timeline Planner</h1>
<div class="header-controls">
<select id="time-interval" aria-label="Select Time Interval">
<option value="5">5m</option>
<option value="10">10m</option>
<option value="15">15m</option>
<option value="30" selected>30m</option>
<option value="60">1h</option>
<option value="120">2h</option>
<option value="180">3h</option>
<option value="360">6h</option>
</select>
<button id="import-json" aria-label="Import JSON" onclick="document.getElementById('load-plan').click()">📥</button>
<button id="export-json" aria-label="Export JSON" onclick="window.exportPlan()">📤</button>
<button id="clear-data" aria-label="Clear Data" onclick="clearData()">🗑️</button>
<button id="generate-random" aria-label="Generate Random Data" onclick="generateRandomData()">🎲</button>
</div>
</header>
<main>
<section id="input-section" aria-label="Timeline Input">
<h2>Plan Your Timeline</h2>
<form id="timeline-form">
<label for="event-name">Event Name (optional):</label>
<input type="text" id="event-name" name="eventName">
<label for="target-end-time">Target End Time:</label>
<input type="datetime-local" id="target-end-time" name="targetEndTime" required>
<div id="events-container">
<h3>Events</h3>
<div class="event">
<input type="text" name="eventName" placeholder="Name" required>
<input type="number" name="eventDuration" placeholder="Mins" min="1" required>
<button type="button" class="move-up" aria-label="Move Up">⬆️</button>
<button type="button" class="move-down" aria-label="Move Down">⬇️</button>
<button type="button" class="remove-event" aria-label="Remove">🗑️</button>
</div>
</div>
<button type="button" id="add-event" aria-label="Add Event">➕</button>
</form>
</section>
<section id="timeline-section" aria-label="Timeline Display">
<h2>Calculated Timeline</h2>
<div id="timeline">
<div class="timeline-content">
<div class="timeline-events-column" id="timeline-events-column"></div>
</div>
</div>
</section>
</main>
<input type="file" id="load-plan" accept=".json" hidden aria-label="Load Plan">
<script src="script.js" type="module"></script>
<script data-goatcounter="https://priv-ana.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    </body>
<footer style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; text-align: center; padding: 10px;">
</footer>
</html>
