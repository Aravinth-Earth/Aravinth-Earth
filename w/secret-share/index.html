            /* site-theme:applies-before-paint */
            (function () {
                try {
                    var THEMES = [
                        'current', 'light', 'amber', 'teal', 'charcoal',
                        'greenish', 'colorful', 'sunset', 'nord', 'cyberpunk'
                    ];
                    var saved = localStorage.getItem('site-theme');
                    // Validate before applying. An unknown value would fall
                    // through to the default tokens -- an unpainted page --
                    // and, because the switcher only reads valid keys, it
                    // would never be repaired. The switcher writes the
                    // resolved value back, so an invalid one self-heals.
                    if (saved && THEMES.indexOf(saved) !== -1) {
                        document.documentElement.setAttribute('data-theme', saved);
                    } else if (
                        window.matchMedia &&
                        window.matchMedia('(prefers-color-scheme: light)').matches
                    ) {
                        document.documentElement.setAttribute('data-theme', 'light');
                    } else {
                        document.documentElement.setAttribute('data-theme', 'current');
                    }
                } catch (e) {
                    /* storage unavailable -- the default theme is fine */
                }
            })();

<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<div class="container" id="main-content" tabindex="-1" role="main">
<h1>Secret Share</h1>
<p class="sub">Encrypt messages in your browser. Nothing leaves this device. Uses AES-GCM + PBKDF2 via Web Crypto API.</p>

<div class="card" id="encryptCard">
<h2>Encrypt</h2>
<div class="param-row">
<div><label for="iterations">Encryption iterations</label><select id="iterations"><option value="600000">600K (slow, secure)</option><option value="350000" selected>350K (recommended)</option><option value="100000">100K (faster)</option></select></div>
<div><label for="hash">Encryption hash</label><select id="hash"><option value="SHA-512">SHA-512</option><option value="SHA-384">SHA-384</option><option value="SHA-256" selected>SHA-256</option></select></div>
</div>
<label for="plaintext">Message to encrypt</label>
<textarea id="plaintext" rows="4" placeholder="Enter message to encrypt..."></textarea>
<label for="encPwd">Encryption password</label>
<input type="password" id="encPwd" placeholder="Password">
<label for="encSalt">Encryption salt phrase</label>
<input type="text" id="encSalt" placeholder="Salt phrase" value="shared-secret">
<div class="timer" id="encTimer" role="status"></div>
<div class="btn-group">
<button class="btn btn-primary" onclick="doEncrypt()">Encrypt</button>
<button class="btn btn-secondary" onclick="clearEncrypt()">Clear</button>
</div>
<div class="result-box" id="encResult"><div class="label">Encrypted text (share this):</div><div id="encOutput"></div><button class="btn btn-secondary" style="margin-top:0.5rem;width:100%" onclick="copyText('encOutput')">Copy</button></div>
<div class="error-box" id="encError" role="alert"></div>
</div>

<div class="card" id="decryptCard">
<h2>Decrypt</h2>
<div class="param-row">
<div><label for="decIterations">Decryption iterations</label><select id="decIterations"><option value="600000">600K (slow, secure)</option><option value="350000" selected>350K (recommended)</option><option value="100000">100K (faster)</option></select></div>
<div><label for="decHash">Decryption hash</label><select id="decHash"><option value="SHA-512">SHA-512</option><option value="SHA-384">SHA-384</option><option value="SHA-256" selected>SHA-256</option></select></div>
</div>
<label for="ciphertext">Encrypted text to decrypt</label>
<textarea id="ciphertext" rows="4" placeholder="Paste encrypted text here..."></textarea>
<label for="decPwd">Decryption password</label>
<input type="password" id="decPwd" placeholder="Password">
<label for="decSalt">Decryption salt phrase</label>
<input type="text" id="decSalt" placeholder="Salt phrase" value="shared-secret">
<div class="timer" id="decTimer" role="status"></div>
<div class="btn-group">
<button class="btn btn-primary" onclick="doDecrypt()">Decrypt</button>
<button class="btn btn-secondary" onclick="clearDecrypt()">Clear</button>
</div>
<div class="result-box" id="decResult"><div class="label">Decrypted message:</div><div id="decOutput"></div><button class="btn btn-secondary" style="margin-top:0.5rem;width:100%" onclick="copyText('decOutput')">Copy</button></div>
<div class="error-box" id="decError" role="alert"></div>
</div>

</div>

<script>
function ab2b64(ab){return btoa(String.fromCharCode(...new Uint8Array(ab)))}
function b642ab(b64){return Uint8Array.from(atob(b64),c=>c.charCodeAt(0)).buffer}
function enc(t){return new TextEncoder().encode(t)}
function dec(b){return new TextDecoder().decode(b)}

async function deriveKey(pwd,salt,iter,hash){
  const baseKey=await crypto.subtle.importKey('raw',enc(pwd),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc(salt),iterations:iter,hash:hash},baseKey,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}

async function doEncrypt(){
  const pt=document.getElementById('plaintext').value;
  const pwd=document.getElementById('encPwd').value;
  const salt=document.getElementById('encSalt').value;
  const iter=parseInt(document.getElementById('iterations').value);
  const hash=document.getElementById('hash').value;
  const timer=document.getElementById('encTimer');
  const err=document.getElementById('encError');err.classList.remove('show');
  const res=document.getElementById('encResult');res.classList.remove('show');
  if(!pt||!pwd||!salt){err.textContent='Fill all fields';err.classList.add('show');return}
  timer.textContent='Encrypting...';
  try{
    const key=await deriveKey(pwd,salt,iter,hash);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc(pt));
    const saltBytes=enc(salt);
    const out=btoa(String.fromCharCode(...new Uint8Array([...saltBytes,...iv,...new Uint8Array(ct)])));
    document.getElementById('encOutput').textContent=out;
    res.classList.add('show');
    timer.textContent='Encrypted successfully';
  }catch(e){err.textContent='Error: '+e.message;err.classList.add('show');timer.textContent=''}
}

async function doDecrypt(){
  const ct=document.getElementById('ciphertext').value;
  const pwd=document.getElementById('decPwd').value;
  const salt=document.getElementById('decSalt').value;
  const iter=parseInt(document.getElementById('decIterations').value);
  const hash=document.getElementById('decHash').value;
  const timer=document.getElementById('decTimer');
  const err=document.getElementById('decError');err.classList.remove('show');
  const res=document.getElementById('decResult');res.classList.remove('show');
  if(!ct||!pwd||!salt){err.textContent='Fill all fields';err.classList.add('show');return}
  timer.textContent='Decrypting...';
  try{
    const raw=Uint8Array.from(atob(ct),c=>c.charCodeAt(0));
    const saltLen=enc(salt).length;
    const iv=raw.slice(saltLen,saltLen+12);
    const data=raw.slice(saltLen+12);
    const key=await deriveKey(pwd,salt,iter,hash);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
    document.getElementById('decOutput').textContent=dec(pt);
    res.classList.add('show');
    timer.textContent='Decrypted successfully';
  }catch(e){err.textContent='Error: Wrong password, salt, or corrupted data';err.classList.add('show');timer.textContent=''}
}

function clearEncrypt(){
  document.getElementById('plaintext').value='';
  document.getElementById('encPwd').value='';
  document.getElementById('encResult').classList.remove('show');
  document.getElementById('encError').classList.remove('show');
  document.getElementById('encTimer').textContent='';
}

function clearDecrypt(){
  document.getElementById('ciphertext').value='';
  document.getElementById('decPwd').value='';
  document.getElementById('decResult').classList.remove('show');
  document.getElementById('decError').classList.remove('show');
  document.getElementById('decTimer').textContent='';
}

async function copyText(id){
  const t=document.getElementById(id).textContent;
  try{await navigator.clipboard.writeText(t);alert('Copied!')}catch{alert('Copy failed')}
}
</script>
