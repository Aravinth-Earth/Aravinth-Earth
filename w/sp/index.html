<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<link rel="preconnect" href="https://api.visitorbadge.io">

<div class="container">
<div class="controls">
<button id="add-row-btn">
<span class="icon-symbol icon-add"></span> Add Row
            </button>
<button id="add-column-btn">
<span class="icon-symbol icon-column"></span> Add Column
            </button>
<button id="clear-filters-btn">
<span class="icon-symbol icon-filter"></span> Clear Filters
            </button>
<button id="clear-table-btn">
<span class="icon-symbol icon-clear"></span> Clear Table
            </button>
<button id="export-btn">
<span class="icon-symbol icon-save"></span> Export
            </button>
<button id="import-btn">
<span class="icon-symbol icon-load"></span> Import
            </button>
<input type="file" id="import-input" accept=".json" style="display:none">

<div class="table-wrapper">
<table id="dynamicTable">
<thead>
<!-- Header and filter rows will be rendered by JavaScript -->
</thead>
<tbody>
<!-- Rows will be rendered by JavaScript -->
</tbody>
</table>

</div>

<script src="js/indexeddb.js"></script>
<script src="js/operations.js"></script>
